# hd-dumper spec: the client facts an APK's data tables do not contain.
#
# Everything else hd-dumper writes is a rule over the APK's own CSVs. The facts
# here are properties of the client's code, measured from a live client (runtime GDB read):
#
#   * `[[walk]]` is the order generator's candidate table walk, in the client's
#     own order, each table with its data-type number (ID = type*100000 + row).
#     Membership is otherwise almost derivable: every table whose CSV carries
#     OrderValue/OrderPrice/OrderExp/UnlockLevel is walked, plus nine walked
#     tables that do not (animal_feed, tools, boosters, vouchers, money,
#     mine_goods, collection_tools, limited_collection_tools, puzzle_pieces).
#   * `unlock_default` is the UnlockLevel the client uses for a walked row whose
#     CSV cell is empty or absent; `[[unlock_row]]` are the exceptions.
#
# Nothing else about a row is an input: the rows, their order inside a table and
# the OrderValue/OrderPrice/OrderExp values all come from the CSV. money.csv's
# data-type number is derived from the APK itself, so `money_type` is only
# needed if that derivation cannot decide (a run reports what it found).

unlock_default = 1

# The data types the client allocates avatar bitsets for, in the client's order.
